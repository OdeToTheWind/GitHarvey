name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. **Never paste your GitHub token** into an issue, a screenshot or a log.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Sign in with GitHub\n2. Search for ...\n3. ..."
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - The hosted site
        - My own deployment (self-hosted)
        - Running locally
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Windows 11
